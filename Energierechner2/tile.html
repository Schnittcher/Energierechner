<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Das Dokument ist fest verankert und kann nicht selbst scrollen. Sonst faengt der Rahmen in der iOS-App senkrechte Wischgesten ab,
   und die Seite der App laesst sich ueber der Kachel nicht mehr scrollen. */
html,body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden;background:transparent;touch-action:pan-y;overscroll-behavior-x:none}
:root{
  --tx:var(--content-color,#fff);
  --ac:var(--accent-color,#3b82c4);
  --sub:color-mix(in srgb,var(--tx) 60%,transparent);
  --hint:color-mix(in srgb,var(--tx) 45%,transparent);
  --bd:color-mix(in srgb,var(--tx) 20%,transparent);
  --bg:color-mix(in srgb,var(--tx) 14%,transparent);
}
#wrap{width:100%;height:100%;font-size:12px;color:var(--tx);padding:var(--pt,28px) var(--pr,36px) var(--pb,48px) 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;container-type:inline-size}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip,.sel{font-size:12px;line-height:1.2;color:var(--tx);padding:3px 10px;border-radius:999px;border:1px solid var(--bd);background:transparent;cursor:pointer;flex:none}
.chip.on,.sel.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sel{appearance:none;-webkit-appearance:none;width:72px;text-overflow:ellipsis}
.sel option{color:#222}
.nav{font-size:13px}
.arrow{font-size:22px;font-weight:600;line-height:1;color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);border-radius:999px;width:32px;height:28px;padding:0 0 3px;cursor:pointer;flex:none}
.arrow:disabled{color:var(--hint);background:transparent;border-color:var(--bd);opacity:.5;cursor:default}
.hero{cursor:pointer;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero .n{font-size:clamp(26px,11cqw,44px);font-weight:300;line-height:1.1;letter-spacing:-.02em}
.hero .u{font-size:14px;color:var(--sub)}
.bal{font-size:15px;font-weight:600}
.delta{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.delta b{font-weight:600}
.hint{font-size:11px;color:var(--hint)}
.lab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px}
.track{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.track i{display:block;height:100%;background:var(--ac);border-radius:3px}
.stack{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden}
.stack i{display:block}
.warn{display:flex;gap:8px;align-items:center;font-size:12px;padding:8px 10px;border-radius:8px;background:rgba(224,160,40,.22)}
.warn span{flex:1}
.warn button{font-size:12px;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.det{overflow-x:hidden;overflow-y:auto;font-size:13px;flex:1;min-height:0}
.det{touch-action:pan-y;scrollbar-width:none}.det::-webkit-scrollbar{display:none}
.det .g{font-size:11px;color:var(--hint);padding:8px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.det .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd)}
.det .r b{font-weight:500}
.foot{margin-top:2px;font-size:11px;color:var(--hint);display:flex;justify-content:space-between;gap:10px}.foot span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.foot span:last-child{flex:none}
.empty{color:var(--sub);font-size:14px;margin:auto;text-align:center}
/* Kompakte Darstellung fuer kleine Kacheln: Zeitraum, Hauptwert und Vorjahrespfeil; Tippen auf den Wert wechselt den Zeitraum */
#wrap.compact{padding:var(--pt,26px) var(--pr,32px) var(--pb,40px) 10px;gap:6px}
.compact .extra,.compact .chips,.compact .arrow,.compact .pd{display:none}
.compact .hero .n{font-size:clamp(24px,13cqw,34px)}
.compact .nav{font-size:12px;justify-content:flex-start;color:var(--sub)}
</style>
</head>
<body>
<div id="probe" style="position:fixed;left:0;top:0;width:100%;height:1px;pointer-events:none"></div>
<div id="wrap"></div>
<script>
var DATA = __TILE_DATA__;
var sel = null;
var detail = false;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function L(k){return (DATA.labels && DATA.labels[k]) || k}
function num(v,d){return Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function eur(v){return num(v,Math.abs(v)>=1000?0:2)+' €'}
function kwh(v){return num(v,Math.abs(v)<100?1:0)+' '+esc(DATA.unit||'')}
function byGroup(g){var o={};(DATA.periods||[]).forEach(function(p){if(p.group===g)o[p.role]=p});return o}
function groups(){return ['day','week','month','year'].filter(function(g){return (DATA.periods||[]).some(function(p){return p.group===g})})}
function others(){return (DATA.periods||[]).filter(function(p){return ['tariff','custom','total'].indexOf(p.group)>=0})}
function current(){
  var ps=DATA.periods||[];if(!ps.length)return null;
  if(sel&&sel.key){var f=ps.filter(function(p){return p.key===sel.key})[0];if(f)return f}
  var gs=groups();
  if(!sel||!sel.group||gs.indexOf(sel.group)<0){sel={group:gs.indexOf('month')>=0?'month':(gs[0]||null),role:'cur'}}
  if(sel.group){var o=byGroup(sel.group);return o[sel.role]||o.cur||o.prev}
  sel={key:ps[0].key};return ps[0]}
/* HT/NT nur zeigen, wenn die Instanz es eingeschaltet hat und der Tarif einen Niedertarif kennt */
function showHtNt(){var F=DATA.flags||{};return !!F.htnt&&F.hasNt!==false}
/* Verbrauch gegenueber dem gleichen Zeitraum im Vorjahr */
function delta(v){
  if(!(v.lastYearConsumption>0)||v.consumption==null)return '';
  var d=Math.round((v.consumption/v.lastYearConsumption-1)*100),up=d>0;
  return '<b style="color:'+(up?'#e0734a':'var(--ac)')+'">'+(up?'▲ +':(d<0?'▼ ':'● '))+d+' %</b> <span class="pd">'+esc(L('consumption'))+' </span>'+esc(L('vsLastYear'))}
/* Durchschnittskosten je Tag (nicht fuer einzelne Tage) */
function perDay(v){return v.days>1&&v.costs>0?v.costs/v.days:0}
/* Der aktuelle Tarifabschnitt als Text */
function ct(x){return num(x,x%1?1:0)}
function tariffText(){
  var t=DATA.tariff;if(!t)return '';
  var u=esc(DATA.unit||''),s=[];
  if(t.supplier)s.push(esc(t.supplier));
  s.push(t.dynamic?esc(L('dynamicPrice')):(t.nt!=null&&t.nt!==t.ht?ct(t.ht)+' / '+ct(t.nt)+' ct/'+u:ct(t.ht)+' ct/'+u));
  if(t.until)s.push(esc(L('validUntil'))+' '+new Date(t.until*1000).toLocaleDateString([], {day:'2-digit',month:'2-digit',year:'numeric'}));
  return s.join(' · ')}
/* Kompakt, wenn die Kachel schmal oder niedrig ist */
var compact=false;
function setCompact(){
  var c=window.innerWidth<=300||window.innerHeight<=220,w=document.getElementById('wrap');
  if(w)w.classList.toggle('compact',c);
  var changed=c!==compact;compact=c;return changed}
function infoLine(v){
  var d=delta(v),p=perDay(v)>0?'<span class="pd">'+(d?' · ':'')+'Ø '+eur(perDay(v))+' / '+esc(L('day'))+'</span>':'';
  return d||p?'<div class="delta hint">'+d+p+'</div>':''}
/* Guthaben oder Nachzahlung gegenueber den Abschlaegen, falls der Zeitraum einen Saldo hat */
function balanceLine(v){
  if(!(DATA.flags||{}).balance||v.balance==null||Math.abs(v.balance)<0.005)return '';
  var ok=v.balance>=0;
  return '<div class="bal" style="color:'+(ok?'var(--ac)':'#e0734a')+'">'+esc(L(ok?'credit':'additionalPayment'))+' '+eur(Math.abs(v.balance))+'</div>'}
function row(l,v){return '<div class="r"><span>'+esc(l)+'</span><b>'+v+'</b></div>'}
function pct(a,b){return b>0?Math.round(a/b*100):0}

function render(){
  var w=document.getElementById('wrap'),p=current();
  if(!p){w.innerHTML='<div class="empty">'+esc(L('noPeriods'))+'</div>';return}
  setCompact();
  if(compact)detail=false;
  var v=p.v||{},F=DATA.flags||{},h='';
  var chips=groups().map(function(g){return '<button class="chip'+(sel.group===g?' on':'')+'" data-g="'+g+'">'+esc(L(g))+'</button>'}).join('');
  var oth=others();
  if(oth.length){chips+='<select class="sel'+(sel.key?' on':'')+'" id="more"><option value="">'+esc(L('more'))+'</option>'+oth.map(function(o){return '<option value="'+esc(o.key)+'"'+(sel.key===o.key?' selected':'')+'>'+esc(o.label)+'</option>'}).join('')+'</select>'}
  if(!compact)h+='<div class="row"><div class="chips">'+chips+'</div></div>';

  var o=sel.group?byGroup(sel.group):{},canNav=!!(o.cur&&o.prev);
  if(compact)h+='<div class="row nav"><span>'+esc(p.label)+((DATA.warnings||[]).length?' ⚠':'')+'</span></div>';
  else h+='<div class="row nav"><button class="arrow" id="prev" '+(canNav&&p.role==='cur'?'':'disabled')+' aria-label="‹">‹</button><span>'+esc(p.label)+'</span><button class="arrow" id="next" '+(canNav&&p.role==='prev'?'':'disabled')+' aria-label="›">›</button></div>';

  if(detail){
    h+='<div class="hint" style="cursor:pointer" id="back">'+esc(L('back'))+'</div><div class="det"><div class="g">'+esc(L('costs'))+'</div>'+row(L('costs'),eur(v.costs||0));
    if(F.base&&v.costsWork!=null)h+=row(L('costsWork'),eur(v.costsWork))+row(L('costsBase'),eur(v.costsBase||0));
    if(v.peakDay)h+=row(L('peakDay'),new Date(v.peakDay*1000).toLocaleDateString([], {day:'2-digit',month:'2-digit'})+' · '+eur(v.peakCosts||0));
    if(v.consumption>0)h+=row(L('effective'),num((v.costs||0)/v.consumption*100,1)+' ct');
    h+='<div class="g">'+esc(L('consumption'))+'</div>'+row(L('consumption'),kwh(v.consumption||0))+(v.lastYearConsumption>0?row(L('consumption')+' '+L('vsLastYear'),kwh(v.lastYearConsumption)):'');
    if(showHtNt()&&v.consumptionHt!=null)h+=row(L('ht'),kwh(v.consumptionHt)+' / '+eur(v.costsHt||0))+row(L('nt'),kwh(v.consumptionNt||0)+' / '+eur(v.costsNt||0));
    if(v.energy>0)h+=row(L('energy'),num(v.energy,0)+' kWh');
    if(F.forecast&&v.forecastCosts!=null)h+='<div class="g">'+esc(L('forecast'))+'</div>'+row(L('forecastCosts'),eur(v.forecastCosts))+row(L('forecastConsumption'),kwh(v.forecastConsumption||0));
    if(F.balance&&v.balance!=null)h+='<div class="g">'+esc(L('advance'))+'</div>'+row(L('balance'),eur(v.balance));
    if(perDay(v)>0)h+=row(L('avgPerDay'),eur(perDay(v)));
    if(DATA.tariff)h+='<div class="g">'+esc(L('tariff'))+'</div>'+row(DATA.tariff.name||L('tariff'),tariffText());
    h+='</div>';
  }else{
    h+='<div class="hero" id="hero"><span class="n">'+eur(v.costs||0)+'</span><span class="u">'+kwh(v.consumption||0)+'</span></div>'+(balanceLine(v)?'':'<div class="hint extra">'+esc(L('tapDetails'))+'</div>')+balanceLine(v)+infoLine(v);
    if(F.forecast&&p.open&&v.forecastCosts>0)h+='<div class="extra"><div class="lab"><span>'+esc(L('forecastCosts'))+'</span><span>'+eur(v.forecastCosts)+'</span></div><div class="track"><i style="width:'+Math.min(100,pct(v.costs||0,v.forecastCosts))+'%"></i></div></div>';
    var t=(v.consumptionHt||0)+(v.consumptionNt||0);
    if(showHtNt()&&t>0){
      var ph=(v.consumptionHt||0)/t*100,pn=100-ph;
      h+='<div class="extra"><div class="lab"><span>'+esc(L('ht'))+' / '+esc(L('nt'))+'</span><span>'+Math.round(ph)+' % / '+Math.round(pn)+' %</span></div><div class="stack">'+(ph>0?'<i style="width:'+ph+'%;background:var(--ac)"></i>':'')+(pn>0?'<i style="width:'+pn+'%;background:var(--bd)"></i>':'')+'</div></div>';
    }
  }
  var ws=DATA.warnings||[];
  if(ws.length&&!detail)h+='<div class="warn extra"><span>⚠ '+esc(ws[0])+(ws.length>1?' (+'+(ws.length-1)+')':'')+'</span><button id="recalc">'+esc(L('recalculate'))+'</button></div>';
  if(DATA.updated){var d=new Date(DATA.updated*1000);h+='<div class="foot extra"><span>'+(!detail&&DATA.tariff?tariffText():'')+'</span><span>'+esc(L('updated'))+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span></div>'}
  w.innerHTML=h;
  bind(p);
}

function bind(p){
  var q=function(s){return document.querySelector(s)};
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){b.onclick=function(){sel={group:b.getAttribute('data-g'),role:'cur'};detail=false;render()}});
  var m=q('#more');if(m)m.onchange=function(){if(m.value){sel={key:m.value}}else{sel=null}detail=false;render()};
  var pv=q('#prev'),nx=q('#next');
  if(pv)pv.onclick=function(){if(sel.group){sel.role='prev';render()}};
  if(nx)nx.onclick=function(){if(sel.group){sel.role='cur';render()}};
  var hero=q('#hero');if(hero)hero.onclick=function(){
    if(compact){var gs=groups();if(gs.length>1){var i=gs.indexOf(sel.group);sel={group:gs[(i+1)%gs.length],role:'cur'}}render()}
    else{detail=true;render()}};
  var back=q('#back');if(back)back.onclick=function(){detail=false;render()};
  var rc=q('#recalc');if(rc)rc.onclick=function(){rc.textContent='…';if(typeof requestAction==='function'){requestAction('TileRecalculate',true)}};
}

/* Die App setzt die Kachel je nach Ansicht versetzt in ihren Rahmen und schneidet rechts ab, ohne die Breite zu kuerzen.
   Hier wird gemessen, wo die Kachel tatsaechlich liegt, und der Inhalt auf den sichtbaren Bereich begrenzt. */
function measure(){
  if(!('IntersectionObserver' in window))return;
  var p=document.getElementById('probe'),w=document.getElementById('wrap');
  if(!p||!w)return;
  // Der Messpunkt ist so breit wie der Rahmen. Seine sichtbare Breite zeigt, wie viel die App tatsaechlich zeigt.
  var io=new IntersectionObserver(function(es){
    io.disconnect();
    var e=es[es.length-1],b=e.boundingClientRect,i=e.intersectionRect;
    if(b.width<50)return;
    if(i.width>50&&i.width<b.width-1)w.style.width=Math.floor(i.width)+'px';
    else if(i.width>=b.width-1)w.style.width='';
  },{threshold:[0,1]});
  io.observe(p);
}
function fit(){
  var w=document.getElementById('wrap');
  var top=null;
  try{var fr=window.frameElement;if(fr&&fr.parentElement){top=fr.getBoundingClientRect().top-fr.parentElement.getBoundingClientRect().top}}catch(e){}
  // Liegt der App-Kopf schon oberhalb der Kachel, braucht sie kaum Abstand; liegt er darueber, muss Platz bleiben
  w.style.setProperty('--pt',top===null?'28px':(top>=36?'12px':'38px'));
  // Ohne Messung gilt die Annahme der App-Ansicht: Der Rahmen beginnt unter dem App-Kopf, behaelt aber seine volle Hoehe,
  // unten fehlt also etwa die Hoehe des Kopfes. Liegt er nachweislich buendig, genuegt ein kleiner Rand.
  w.style.setProperty('--pb',top!==null&&top<10?'12px':'48px');
  // Der Rahmen ist beim Start oft noch nicht fertig platziert: mehrfach messen
  measure();
  [250,1000,3000].forEach(function(ms){setTimeout(measure,ms)});
}

/* Die Kachel soll sich nicht seitlich verschieben lassen (abgeschnittener Rand der App). Waagerechtes Wischen wird abgefangen,
   ausser auf der Chip-Leiste. Senkrechtes Wischen geht an die App, damit sich ihre Seite auch ueber der Kachel scrollen laesst;
   nur die Liste der Detailansicht scrollt selbst. */
(function(){
  var sx=0,sy=0,inChips=false;
  document.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;inChips=!!(e.target.closest&&e.target.closest('.chips'))},{passive:true});
  document.addEventListener('touchmove',function(e){
    var t=e.touches[0];
    var horizontal=Math.abs(t.clientX-sx)>Math.abs(t.clientY-sy);
    if(horizontal&&!inChips&&e.cancelable)e.preventDefault();
  },{passive:false});
})();

function handleMessage(data){
  try{DATA=(typeof data==='string')?JSON.parse(data):data;render()}catch(e){}
}
render();
fit();
window.addEventListener('resize',function(){document.getElementById('wrap').style.width='';if(setCompact())render();fit()});
</script>
</body>
</html>
